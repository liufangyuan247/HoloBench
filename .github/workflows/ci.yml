name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    name: Core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Configure
        run: cmake --preset core-ci
      - name: Build
        run: cmake --build --preset core-ci
      - name: Test
        run: ctest --preset core-ci

  windows-app-build:
    name: Windows application compile
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Configure
        run: cmake --preset dev
      - name: Build
        run: cmake --build --preset dev
