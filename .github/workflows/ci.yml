name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    name: Core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Configure
        run: cmake --preset core-ci
      - name: Build
        run: cmake --build --preset core-ci
      - name: Test
        run: ctest --preset core-ci

  app-compile:
    name: Application Compile (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build \
            pkg-config \
            libgl1-mesa-dev \
            libegl1-mesa-dev \
            libx11-dev \
            libxext-dev \
            libxcursor-dev \
            libxi-dev \
            libxrandr-dev \
            libxss-dev \
            libxxf86vm-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libdrm-dev \
            libgbm-dev
      - name: Configure
        run: cmake --preset app-ci
      - name: Build
        run: cmake --build --preset app-ci --target holobench_app
      - name: Annotate Windows build failure
        if: failure() && runner.os == 'Windows'
        shell: pwsh
        run: |
          $diagnosticLines = @(& cmake --build --preset app-ci --target holobench_app --verbose 2>&1)
          $diagnosticExitCode = $LASTEXITCODE
          $diagnosticLines | ForEach-Object { Write-Output $_ }

          if ($diagnosticExitCode -eq 0) {
            Write-Output '::warning title=Windows app build retry succeeded::The initial build failed, but the verbose diagnostic retry succeeded.'
            exit 0
          }

          $diagnosticTail = ($diagnosticLines | Select-Object -Last 120 | ForEach-Object { $_.ToString() }) -join "`n"
          $escapedDiagnostic = $diagnosticTail.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
          Write-Output "::error title=Windows app verbose build failed::$escapedDiagnostic"
          exit $diagnosticExitCode
