name: CI

on:
  push:
    branches: [main, "m*/release-integration*"]
  pull_request:

jobs:
  core:
    name: Core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Configure
        run: cmake --preset core-ci
      - name: Build
        run: cmake --build --preset core-ci
      - name: Test
        run: ctest --preset core-ci
      - name: Run M6 CPU performance gate (Windows)
        if: runner.os == 'Windows'
        run: .\out\build\core-ci\holobench_m6_benchmark.exe
      - name: Run M6 CPU performance gate (Linux)
        if: runner.os == 'Linux'
        run: ./out/build/core-ci/holobench_m6_benchmark
      - name: Run M7 teaching-workflow performance gate (Windows)
        if: runner.os == 'Windows'
        run: .\out\build\core-ci\holobench_m7_benchmark.exe
      - name: Run M7 teaching-workflow performance gate (Linux)
        if: runner.os == 'Linux'
        run: ./out/build/core-ci/holobench_m7_benchmark

  app-compile:
    name: Application Compile (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python for Glad generation
        if: runner.os == 'Windows'
        uses: actions/setup-python@v6
        with:
          python-version: '3.14.7'
      - name: Set up MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Install pinned Glad generator dependencies
        if: runner.os == 'Windows'
        run: python -m pip install --disable-pip-version-check "Jinja2==3.1.6" "MarkupSafe==3.0.3"
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build \
            pkg-config \
            libgl1-mesa-dev \
            libegl1-mesa-dev \
            libx11-dev \
            libxext-dev \
            libxcursor-dev \
            libxi-dev \
            libxrandr-dev \
            libxss-dev \
            libxxf86vm-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libdrm-dev \
            libgbm-dev
      - name: Configure Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $pythonExecutable = (Get-Command python).Source
          cmake --preset app-ci "-DPython_EXECUTABLE=$pythonExecutable"
      - name: Configure Linux
        if: runner.os == 'Linux'
        run: cmake --preset app-ci
      - name: Build
        run: cmake --build --preset app-ci --target holobench_app holobench_font_validation
      - name: Validate packaged English/CJK font (Windows)
        if: runner.os == 'Windows'
        run: .\out\build\app-ci\holobench_font_validation.exe
      - name: Validate packaged English/CJK font (Linux)
        if: runner.os == 'Linux'
        run: ./out/build/app-ci/holobench_font_validation
      - name: Annotate Windows build failure
        if: failure() && runner.os == 'Windows'
        shell: pwsh
        run: |
          $diagnosticLines = @(& cmake --build --preset app-ci --target holobench_app --verbose 2>&1)
          $diagnosticExitCode = $LASTEXITCODE
          $diagnosticLines | ForEach-Object { Write-Output $_ }

          if ($diagnosticExitCode -eq 0) {
            Write-Output '::warning title=Windows app build retry succeeded::The initial build failed, but the verbose diagnostic retry succeeded.'
            exit 0
          }

          $diagnosticTail = ($diagnosticLines | Select-Object -Last 120 | ForEach-Object { $_.ToString() }) -join "`n"
          $escapedDiagnostic = $diagnosticTail.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
          Write-Output "::error title=Windows app verbose build failed::$escapedDiagnostic"
          exit $diagnosticExitCode
